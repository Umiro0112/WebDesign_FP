<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="An exploration-based language-learning website."
    >
    <title>Exploration-Based Language Learning</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main class="app-shell" id="app">
      <section class="project-intro" aria-labelledby="project-title">
        <p class="eyebrow">Web Design Final Project</p>
        <h1 id="project-title">Explore a neighborhood.<br>Practice a language.</h1>
        <p class="project-summary">
          A shared world where language learners choose the places, situations,
          and expressions that matter to them.
        </p>
        <p class="project-status" role="status">Project foundation ready.</p>
      </section>

      <section
        class="game-stage"
        id="game-stage"
        aria-label="Game area"
      >
        <div class="game-placeholder">
          <span aria-hidden="true">01</span>
          <p>The neighborhood will appear here.</p>
        </div>
      </section>
    </main>
  </body>
</html>
